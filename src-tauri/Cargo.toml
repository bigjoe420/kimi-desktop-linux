[package]
name = "kimi-desktop-linux"
version = "0.1.0"
description = "Native desktop wrapper for Kimi (Moonshot AI)"
authors = ["Joe Kyser (Noad Laboratories)"]
license = "MIT"
edition = "2021"

[lib]
name = "kimi_desktop_linux_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
